<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Landing Page</title>
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Segoe UI', sans-serif;
      color: #1a1a2e;
      background: #f9fafb;
      line-height: 1.6;
    }

    /* ===== VARIABEL WARNA ===== */
    :root {
      --primary: #6c63ff;
      --primary-dark: #574fd6;
      --accent: #ff6584;
      --light: #f9fafb;
      --dark: #1a1a2e;
      --gray: #6b7280;
      --card-bg: #ffffff;
    }

    /* ===== NAVBAR ===== */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
      z-index: 1000;
      padding: 0 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 65px;
    }
    .nav-logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
    }
    .nav-logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a {
      text-decoration: none;
      color: var(--dark);
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.3s;
    }
    .nav-links a:hover { color: var(--primary); }
    .nav-cta {
      background: var(--primary);
      color: #fff !important;
      padding: 8px 22px;
      border-radius: 50px;
      transition: background 0.3s, transform 0.2s !important;
    }
    .nav-cta:hover { background: var(--primary-dark) !important; transform: translateY(-1px); }

    /* ===== HERO ===== */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 5% 60px;
      background: linear-gradient(135deg, #ede9fe 0%, #fce7f3 50%, #e0f2fe 100%);
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(108,99,255,0.15), transparent 70%);
      top: -100px; left: -100px;
      border-radius: 50%;
    }
    .hero::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,101,132,0.12), transparent 70%);
      bottom: -80px; right: -80px;
      border-radius: 50%;
    }
    .hero-content { position: relative; z-index: 1; max-width: 720px; }
    .hero-badge {
      display: inline-block;
      background: rgba(108,99,255,0.12);
      color: var(--primary);
      padding: 6px 18px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      border: 1px solid rgba(108,99,255,0.25);
    }
    .hero h1 {
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1.2rem;
      color: var(--dark);
    }
    .hero h1 span { color: var(--primary); }
    .hero p {
      font-size: 1.1rem;
      color: var(--gray);
      max-width: 560px;
      margin: 0 auto 2rem;
    }
    .hero-buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 13px 32px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
      display: inline-block;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 8px 25px rgba(108,99,255,0.35);
    }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 12px 30px rgba(108,99,255,0.45); }
    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }
    .btn-outline:hover { background: var(--primary); color: #fff; transform: translateY(-2px); }

    /* ===== FITUR ===== */
    .features {
      padding: 90px 5%;
      background: #fff;
      text-align: center;
    }
    .section-label {
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .section-title {
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      font-weight: 800;
      margin-bottom: 0.8rem;
    }
    .section-sub {
      color: var(--gray);
      max-width: 520px;
      margin: 0 auto 3.5rem;
      font-size: 1rem;
    }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

      background: var(--
